name: Validate Matchup Nightmare
on:
  push:
    branches:
      - main
      - rebuild/prizepicks-evidence-v3
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check app and data-source JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/lib/research-v3.js
          node --check public/lib/evidence-client-v3.js
          node --check functions/api/lines.js
          node --check server.js
      - name: Verify real ESPN NFL ranks exist for three seasons
        if: ${{ github.head_ref == 'feature/nfl-similar-defense-ranks' }}
        run: |
          node --input-type=module <<'NODE'
          for(const year of [2026,2025,2024]){
            const url="https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/14/statistics?season="+year;
            const response=await fetch(url,{signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw new Error("ESPN "+year+" HTTP "+response.status);
            const json=await response.json();
            const groups=json.results?.opponent||[];
            const pass=groups.find(g=>g.name==="passing")?.stats?.find(s=>s.name==="netPassingYards");
            const rush=groups.find(g=>g.name==="rushing")?.stats?.find(s=>s.name==="rushingYards");
            const y=typeof json.requestedSeason==="object"?json.requestedSeason.year:json.requestedSeason;
            console.log(JSON.stringify({year,reportedSeason:y,passRank:pass?.rank,rushRank:rush?.rank,passYpg:pass?.perGameValue,rushYpg:rush?.perGameValue}));
            if(y!=null&&Number(y)!==year||!Number.isInteger(pass?.rank)||
              !Number.isInteger(rush?.rank)||pass.rank<1||pass.rank>32||rush.rank<1||rush.rank>32)
              throw new Error("Missing or invalid source rank for "+year);
          }
          NODE
      - name: Run Node tests
        id: suite
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 150 test-output.log >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Report test failures on PR
        if: ${{ github.event_name == 'pull_request' && steps.suite.outputs.exit_code != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          grep -A 28 '^not ok' test-output.log | head -n 210 > failed-tests.txt || true
          tail -n 16 test-output.log >> failed-tests.txt
          gh pr comment "$PR_NUMBER" --body-file failed-tests.txt
      - name: Enforce successful tests
        if: ${{ steps.suite.outputs.exit_code != '0' }}
        run: exit 1
