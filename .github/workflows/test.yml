name: Validate Matchup Nightmare
on:
  push:
    branches:
      - main
      - fix/strict-matchup-and-playing-time
  pull_request:
    branches: [main]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
