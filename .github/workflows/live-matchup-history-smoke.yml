name: Live verified matchup history smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-history:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify actual Jaxon Smith-Njigba history and defensive matches
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {makeEvidenceClient,loadVerifiedEvidence} from "./public/lib/evidence-client-v3.js";
          import {strictDefenseComparison} from "./public/lib/nfl-defense-depth.js";
          const origin="https://matchup-nightmare-v2.pages.dev";
          let deployed=false;
          for(let attempt=1;attempt<=18;attempt++){
            const asset=await fetch(origin+"/lib/evidence-client-v3.js?version="+Date.now(),{
              cache:"no-store",signal:AbortSignal.timeout(12000)});
            const source=await asset.text();
            const research=await fetch(origin+"/lib/research-v3.js?version="+Date.now(),{
              cache:"no-store",signal:AbortSignal.timeout(12000)});
            const researchSource=await research.text();
            if(asset.ok&&research.ok&&
              source.includes("const years=[season,season-1,season-2,season-3]")&&
              researchSource.includes("const previousSeasonGames=available.filter")&&
              researchSource.includes("return [n-1,n-2,n-3]")){
              console.log("Cloudflare production has deployed the previous-three-season matching rule.");
              deployed=true;break;
            }
            console.log("Waiting for production Pages to deploy new history code: "+attempt);
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          assert.ok(deployed,"New ESPN history fallback must be deployed to Cloudflare production");
          // Never request or manufacture a betting quote in this test.
          // This inspects only published ESPN past games and defensive ranks.
          const fetcher=(path,options={})=>fetch(origin+path,{
            ...options,signal:AbortSignal.timeout(16000)});
          const response=await fetcher("/api/games?sport=nfl&date=2026-10-15");
          assert.ok(response.ok,"ESPN fixture scoreboard available");
          const board=await response.json();
          const game=board.games.find(g=>[g.home?.id,g.away?.id].includes("26"));
          assert.ok(game,"2026-10-15 Seattle Seahawks fixture present");
          const client=makeEvidenceClient({fetcher,concurrency:8});
          const input=await loadVerifiedEvidence({
            client,game,offer:{source:"PropLine",sport:"nfl",
              player:"Jaxon Smith-Njigba",espnPlayerId:"4430878",
              stat:"receptions"},
            onStage:msg=>console.log(msg)
          });
          const recent=input.games.filter(g=>g.season===2026).slice(0,5);
          const history=input.games.filter(g=>g.season<input.season&&g.season>=input.season-3);
          console.log(JSON.stringify({season:input.season,player:input.player.name,
            recentGameCount:recent.length,historyGames:history.length,
            recent:recent.map(g=>({date:g.date,vs:g.opponent,actual:g.actual})),
            hasOpponentRank:!!input.upcomingDefense,
            historicalRanks:input.defensiveProfiles.length,
            fetches:client.stats()}));
          assert.ok(recent.length>=3,"Actual 2026 completed Seahawks game stats should load");
          assert.ok(recent.every(g=>Number.isFinite(g.actual)),"Recorded reception stats are numeric");
          assert.ok(input.upcomingDefense?.verified,"Opponent defensive ranks fetched");
          const profiles=new Map(input.defensiveProfiles.map(p=>[p.gameId+"|"+p.teamId,p]));
          const matches=history.filter(g=>{
            const old=profiles.get(g.id+"|"+g.opponentId);
            return old&&strictDefenseComparison({
              target:input.upcomingDefense,historical:old,
              stat:"receptions",role:"WR",
              targetContext:input.upcomingContext,
              historicalContext:old.context
            }).ok;
          });
          console.log(JSON.stringify({similarDefenses:
            [...new Set(matches.map(g=>g.opponentId))].length,
            matchedGames:matches.length,
            matches:matches.slice(0,8).map(g=>({date:g.date,vs:g.opponent,actual:g.actual}))}));
          assert.ok(matches.length>0,"Real prior-season matchup history must find defensive matches");
          assert.ok(matches.every(g=>g.season<input.season&&
            g.season>=input.season-3),"Similar opponents cannot be current-season games");
          NODE
